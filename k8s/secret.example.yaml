# TEMPLATE — do not commit the filled-in version.
#
# Copy this file to secret.yaml, fill in real values, then apply it
# manually once:
#   kubectl apply -f k8s/secret.yaml
#
# secret.yaml is deliberately NOT listed in kustomization.yaml, so Argo CD
# never sees it and it never needs to live in git. Generate JWT_SECRET with:
#   openssl rand -hex 32

apiVersion: v1
kind: Secret
metadata:
  name: ludo-secrets
  namespace: ludo
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME"
  DATABASE_URL: "postgres://ludo:CHANGE_ME@postgres:5432/ludo"
  JWT_SECRET: "CHANGE_ME_run_openssl_rand_hex_32"
