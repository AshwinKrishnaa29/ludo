name: Oracle ARM Instance Auto-Provisioner

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Setup OCI CLI
        run: |
          pip install oci-cli --quiet

      - name: Write OCI config and private key
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/private_key.pem
          chmod 600 ~/.oci/private_key.pem

          cat > ~/.oci/config << OCICONFIG
          [DEFAULT]
          user=${{ secrets.OCI_USER_ID }}
          fingerprint=${{ secrets.OCI_KEY_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_ID }}
          region=ap-hyderabad-1
          key_file=~/.oci/private_key.pem
          OCICONFIG

      - name: Check if instance already exists
        id: check
        run: |
          COUNT=$(oci compute instance list \
            --compartment-id "${{ secrets.OCI_TENANCY_ID }}" \
            --region ap-hyderabad-1 \
            --shape VM.Standard.A1.Flex \
            --lifecycle-state RUNNING \
            --query "length(data)" \
            --raw-output 2>/dev/null || echo "0")

          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Running instances: $COUNT"

      - name: Try to create instance
        if: steps.check.outputs.count == '0'
        run: |
          echo "No running instance found. Attempting to create..."

          oci compute instance launch \
            --availability-domain "tvSn:AP-HYDERABAD-1-AD-1" \
            --compartment-id "${{ secrets.OCI_TENANCY_ID }}" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus": 4, "memoryInGBs": 24}' \
            --image-id "ocid1.image.oc1.ap-hyderabad-1.aaaaaaaasw3uh2uyc3rqwqbbrzkgus7nf3etwmob7guujjlzxtkecaxgqpkq" \
            --subnet-id "ocid1.subnet.oc1.ap-hyderabad-1.aaaaaaaagr7e47rie46mwl7brxubwwcaij2bwfvtnjftsib3uhfuxo4yozpa" \
            --assign-public-ip true \
            --display-name "ludo-platform" \
            --metadata "{\"ssh_authorized_keys\": \"${{ secrets.OCI_SSH_PUBLIC_KEY }}\"}" \
            --is-pv-encryption-in-transit-enabled true \
            --region ap-hyderabad-1 \
            2>&1 | tee /tmp/result.txt

          if grep -q "Out of host capacity" /tmp/result.txt; then
            echo "No capacity yet. Will retry in 5 minutes."
          elif grep -q "lifecycleState" /tmp/result.txt; then
            echo "SUCCESS! Instance created! Check Oracle Cloud console."
          elif grep -q "LimitExceeded" /tmp/result.txt; then
            echo "Instance already exists!"
          else
            echo "Response:"
            cat /tmp/result.txt
          fi

      - name: Instance already running
        if: steps.check.outputs.count != '0'
        run: |
          echo "Instance already running. Nothing to do."
          echo "Stop this workflow from GitHub Actions settings."
