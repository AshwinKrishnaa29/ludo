name: Oracle ARM Instance Auto-Provisioner

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: |
          pip install oci-cli --quiet
          oci --version

      - name: Write OCI config and private key
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
        run: |
          mkdir -p ~/.oci
          printf '%s' "$OCI_PRIVATE_KEY" > ~/.oci/private_key.pem
          chmod 600 ~/.oci/private_key.pem
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=ap-hyderabad-1\nkey_file=/home/runner/.oci/private_key.pem\n' "$OCI_USER_ID" "$OCI_KEY_FINGERPRINT" "$OCI_TENANCY_ID" > ~/.oci/config
          chmod 600 ~/.oci/config

      - name: Verify config
        env:
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
        run: |
          echo "=== Config file ==="
          cat ~/.oci/config
          echo "=== Key first line ==="
          head -1 ~/.oci/private_key.pem
          echo "=== Key last line ==="
          tail -1 ~/.oci/private_key.pem
          echo "=== Key line count ==="
          wc -l ~/.oci/private_key.pem
          echo "=== Testing OCI connection ==="
          oci iam region list 2>&1 || true

      - name: Try to create instance
        env:
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
        run: |
          echo "Attempting to create VM.Standard.A1.Flex instance..."
          oci compute instance launch \
            --availability-domain "tvSn:AP-HYDERABAD-1-AD-1" \
            --compartment-id "$OCI_TENANCY_ID" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus": 4, "memoryInGBs": 24}' \
            --image-id "ocid1.image.oc1.ap-hyderabad-1.aaaaaaaasw3uh2uyc3rqwqbbrzkgus7nf3etwmob7guujjlzxtkecaxgqpkq" \
            --subnet-id "ocid1.subnet.oc1.ap-hyderabad-1.aaaaaaaagr7e47rie46mwl7brxubwwcaij2bwfvtnjftsib3uhfuxo4yozpa" \
            --assign-public-ip true \
            --display-name "ludo-platform" \
            --metadata "{\"ssh_authorized_keys\": \"$OCI_SSH_PUBLIC_KEY\"}" \
            --region ap-hyderabad-1 \
            2>&1 | tee /tmp/result.txt || true
          echo "--- Response ---"
          cat /tmp/result.txt
          echo "--- End Response ---"
          if grep -qi "Out of host capacity" /tmp/result.txt; then
            echo "RESULT: No capacity yet. Will retry in 5 minutes."
          elif grep -qi "lifecycleState" /tmp/result.txt; then
            echo "RESULT: SUCCESS - Instance created!"
          elif grep -qi "LimitExceeded" /tmp/result.txt; then
            echo "RESULT: Instance already exists."
          elif grep -qi "NotAuthorizedOrNotFound" /tmp/result.txt; then
            echo "RESULT: Auth error - check OCI secrets."
          else
            echo "RESULT: Unknown response."
          fi
